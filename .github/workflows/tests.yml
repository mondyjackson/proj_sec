name: Project tests and Linux executable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: python -m pip install -r requirements-core.txt
      - name: Install checksum-verified Hadolint
        run: python scripts/install_hadolint.py --output tools
      - name: Unit and real Hadolint tests
        env:
          HADOLINT_BIN: ${{ github.workspace }}/tools/hadolint
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Retain actual test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.txt
          if-no-files-found: error

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - name: Build and smoke-test the executable
        run: |
          python scripts/build.py
          ./dist/proj-sec --version
          ./dist/proj-sec compare examples/left-kdes.yaml examples/right-kdes.yaml --output outputs/ci-smoke
      - name: Package executable with permissions intact
        run: |
          tar -czf dist/proj-sec-linux-x86_64.tar.gz -C dist proj-sec
          cd dist
          sha256sum proj-sec-linux-x86_64.tar.gz > CHECKSUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: proj-sec-linux-x86_64
          path: |
            dist/proj-sec-linux-x86_64.tar.gz
            dist/CHECKSUMS.txt
          if-no-files-found: error
